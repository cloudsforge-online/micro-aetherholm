name: CI

# The cross-cutting rules live in the shared reusable workflow (micro-org/service-ci.yml): one
# database per service, no cross-service source imports, /livez + /readyz + /metrics, no env_file
# fan-out, no setInterval doing domain work, .env.example agreeing with the coded PORT, and a
# Postgres container that fails the build if the database suite skipped. Calling it is how this
# repository counts toward the measured target of zero bespoke CI files (docs/ecosystem/03 §5).
#
# What the reusable workflow cannot do here is added below:
#   - `migrate` exercises the migrator AS a migrator, on an empty database, exactly as a deploy
#     runs it — and proves it is idempotent, because a deploy re-runs it on every release.
#   - `rules` asserts, as text, the constraints and guards this service exists to add.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  estate:
    uses: cloudsforge-online/micro-org/.github/workflows/service-ci.yml@main
    with:
      service: aetherholm
      database-env-var: AETHERHOLM_DATABASE_URL
      port: 4120
      # The image startup smoke test boots the real service, and `env.ts` validates its
      # configuration at import — so the container needs the variables it declares, not just a
      # database. The JWKS URL is a CI-only non-secret: never dialled, because /livez needs no
      # identity. Never a real credential.
      #
      # The signing secret is no longer "a throwaway that clears a length check" — that is exactly
      # what `ci-only-not-a-real-secret-000000000000` was, and the boot guard now refuses it
      # (micro-org #142). `@generate` asks service-ci.yml for a fresh `openssl rand -base64 48` per
      # run, thrown away afterwards: CI does not need a WEAK secret, it needs A secret, and nothing
      # in the smoke test verifies a signature against anything else.
      smoke-env: |
        IDENTITY_JWKS_URL=http://127.0.0.1:4001/.well-known/jwks.json
        IDENTITY_ISSUER=http://127.0.0.1:4001
        OUTBOX_SIGNING_SECRET=@generate
    secrets:
      # @cloudsforge/* resolves via link:../runtime, so the workflow checks out micro-runtime
      # and micro-contracts as siblings — both private, hence a contents:read token.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: read

  migrate:
    name: The migrator, on an empty database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        # Not a secret: this database lives for one job, is reachable only from it, and holds
        # nothing.
        env:
          POSTGRES_USER: aetherholm
          POSTGRES_PASSWORD: aetherholm
          POSTGRES_DB: aetherholm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aetherholm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AETHERHOLM_DATABASE_URL: postgres://aetherholm:aetherholm@127.0.0.1:5432/aetherholm_test
      IDENTITY_JWKS_URL: http://127.0.0.1:4001/.well-known/jwks.json
      IDENTITY_ISSUER: http://127.0.0.1:4001
      # OUTBOX_SIGNING_SECRET is deliberately NOT here — see the first step below.
    steps:
      # THE SIGNING SECRET IS GENERATED, not written into the mapping above.
      #
      # `@generate` is a feature of service-ci.yml's `smoke-env` input and nothing substitutes it
      # in a bespoke job's `env:`, so a literal here would reach the migrator as written — and the
      # boot guard refuses `ci-only-not-a-real-secret-000000000000`, which is what used to sit
      # there (micro-org #142). `src/migrator.ts` imports `src/env.ts`, so this job validates the
      # variable too and would exit 1 before touching the schema.
      #
      # Generated per run and thrown away. Masked before it is written, so a later step that dumps
      # its environment cannot put it in the log; nothing here ever prints it.
      - name: A real signing secret, for this run only
        run: |
          set -euo pipefail
          secret="$(openssl rand -base64 48)"
          echo "::add-mask::$secret"
          echo "OUTBOX_SIGNING_SECRET=$secret" >> "$GITHUB_ENV"

      # Temporary: the runtime checkout exists only because the runtime packages are unpublished.
      # On publish this collapses to one checkout.
      - uses: actions/checkout@v4
        with: { path: aetherholm }
      - uses: actions/checkout@v4
        with: { repository: cloudsforge-online/micro-runtime, path: runtime, token: "${{ secrets.ESTATE_READ_TOKEN }}" }
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: aetherholm/pnpm-lock.yaml
      # `link:` resolves to the sibling's own node_modules, so the sibling must be installed
      # before this repository is — without this, `node --import tsx src/migrator.ts` cannot load
      # the runtime source's own imports (@opentelemetry/api, jose) and dies at the first one.
      - name: Install the sibling runtime
        run: |
          set -euo pipefail
          pnpm --dir runtime install --frozen-lockfile
      - name: Install
        working-directory: aetherholm
        run: pnpm install --frozen-lockfile
      - name: Migrate the test database
        working-directory: aetherholm
        run: pnpm migrate
      - name: Migrating twice is a no-op
        working-directory: aetherholm
        # A deploy re-runs the one-shot job on every release; a migrator that is not idempotent
        # turns the second deploy of an unchanged schema into an outage.
        run: pnpm migrate

  rules:
    name: The controls this service exists to add
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Asserted as text so a refactor cannot delete them without a red build. The tests prove
      # they WORK; these prove they are still THERE.
      - name: The world's schema invariants still exist
        run: |
          grep -q 'cities_stocks_settled_within_caps' src/migrations.ts \
            || { echo '::error::the stock-settlement CHECK is gone; a settlement could write a negative or above-cap stock'; exit 1; }
          grep -q 'cities_one_per_player_per_island' src/migrations.ts \
            || { echo '::error::the one-city-per-player-per-island partial unique is gone; a second city is representable'; exit 1; }
          grep -q 'provisions_entitlement_uniq' src/migrations.ts \
            || { echo '::error::the provision idempotency unique is gone; one purchase could raise two skerries'; exit 1; }
          grep -q 'seasons_one_open' src/migrations.ts \
            || { echo '::error::the single-open-season index is gone; two racing replicas could open two worlds'; exit 1; }
          grep -q 'battles_fleet_uniq' src/migrations.ts \
            || { echo '::error::the one-battle-per-arrival unique is gone; two replicas racing one arrival could fight twice'; exit 1; }
          grep -q 'fleets_cargo_within_hold' src/migrations.ts \
            || { echo '::error::the deferred cargo-within-hold constraint is gone; a fleet could depart overloaded'; exit 1; }
          grep -q 'city_ships_count_non_negative' src/migrations.ts \
            || { echo '::error::the garrison CHECK is gone; a launch could take ships a garrison does not hold'; exit 1; }
          grep -q 'seasons_sealed_immutable' src/migrations.ts \
            || { echo '::error::the seal trigger is gone; sealed history would be editable (doc §9.5)'; exit 1; }
          grep -q 'battles_immutable' src/migrations.ts \
            || { echo '::error::the battles append-only trigger is gone; a battle report could be rewritten'; exit 1; }

      # Rule 6 of docs/ecosystem/03 §2. This service stored a user_id in nine places and erased
      # none of them on request; a deletion reported success and left every city standing. These
      # greps are cheap and they are what stops that regressing to silence again.
      - name: The right to erasure is still wired up, and still one-way
        run: |
          grep -q "'identity.user.deleted'" src/erasure.ts \
            || { echo '::error::the erasure topic is gone; a deletion request would silently do nothing'; exit 1; }
          grep -q "'/v1/events'" src/server.ts \
            || { echo '::error::the inbound event webhook is gone; identity.user.deleted cannot be delivered'; exit 1; }
          grep -q 'SUBSCRIBED_TOPICS' src/server.ts \
            || { echo '::error::the subscribed-topic set is gone; an unsubscribed topic would 4xx and retry for ever'; exit 1; }
          grep -q 'aetherholm_erasure_one_way' src/migrations.ts \
            || { echo '::error::the one-way erasure trigger is gone; an anonymised row could be re-attributed to a person'; exit 1; }
          grep -q 'archipelagos_owner_subject_shape' src/migrations.ts \
            || { echo '::error::the erased-owner CHECK is gone; an erased skerry owner is no longer distinguishable from a real one'; exit 1; }
          grep -q 'chronicles_rewrite_is_declared' src/migrations.ts \
            || { echo '::error::the chronicle rewrite CHECK is gone; a redacted chronicle could claim to be intact'; exit 1; }
          grep -q 'digest_at_sealing' src/migrations.ts \
            || { echo '::error::digest_at_sealing is gone; a redacted chronicle would lose the record of what it used to hash to'; exit 1; }

      # The escape hatch that lets an erasure rewrite frozen history is the one thing in this
      # repository that can edit a sealed record. It is a flag, so it is a grep — and the count of
      # places that set it must stay at one, in the handler, where a reviewer will look.
      - name: Only the erasure handler may unlock immutable history
        run: |
          setters=$(grep -rl "set_config('aetherholm.erasure'" src --include='*.ts' \
                    | grep -v '\.test\.ts$' || true)
          if [ "$setters" != "src/erasure.ts" ]; then
            echo "::error::aetherholm.erasure is set outside src/erasure.ts: ${setters:-<nowhere>}"
            exit 1
          fi
          echo 'ok: one setter, in the erasure handler'

      - name: This service holds no money
        # There is no balance or Shard column anywhere: the Charter and season pass are billing
        # products, cosmetics are worlds entitlements, resources are game material. A balance
        # column is the first step of a second ledger.
        run: |
          if grep -nE '^\s+(balance|shards|held_amount|available)\s' src/migrations.ts; then
            echo '::error::a balance column appeared in the schema; the ledger owns balances'
            exit 1
          fi
          echo 'ok: no balance column'

      - name: A queue submission still requires an idempotency key
        run: |
          grep -q 'idempotency-key' src/server.ts \
            || { echo '::error::a queue submission no longer requires an Idempotency-Key; a retry re-charges'; exit 1; }

      - name: The provision path still cannot reach the aegis
        # The aegis is free at founding and never sold (20-aetherholm.md §4). The suite proves the
        # behaviour; this proves the guard test is still present.
        run: |
          grep -q 'aegis' src/titlecontract.test.ts \
            || { echo '::error::the aegis-absence assertion is gone from the title-contract suite'; exit 1; }

  hygiene:
    uses: cloudsforge-online/micro-org/.github/workflows/secret-hygiene.yml@main
    permissions:
      contents: read

  # ──────────────────────────────────────────────────────────────────────────────────────────────
  # THE IMAGE, PUBLISHED. `cfctl release` writes a manifest naming ghcr.io/cloudsforge-online/<repo>
  # at this repository's package.json version (micro-org tools/cfctl.ts:889-934, image name derived
  # at tools/registry.ts:367-369); `cfctl release --verify` runs `docker manifest inspect` on every
  # entry (cfctl.ts:937-975); and deploy/scripts/release-deploy.sh:99-125 refuses to change anything
  # until all of them pull. Until this job existed CI built this image and threw it away, so that
  # gate rejected every service in the estate and the manifest path could not be used at all.
  #
  # `packages: write` IS GRANTED HERE rather than asked for inside the shared CI workflow, and that
  # is forced rather than stylistic: a called workflow's GITHUB_TOKEN can only be maintained or
  # reduced, never elevated, so a reusable workflow asking for a permission its caller withheld
  # fails the whole run at STARTUP — before a step runs, on pull requests as well as on main.
  # Measured on micro-org: run 30900277471 (caller capped at `packages: read`) ended in
  # startup_failure; run 30900280323 (same workflow, caller granted `packages: write`) succeeded.
  # That is also why `push: false` is correct and stays in the shared workflow's image job — that
  # job is a GATE and needs `load:` so it can boot the image and read its health endpoint. This is
  # the producer. Different purposes, so different jobs.
  # ──────────────────────────────────────────────────────────────────────────────────────────────
  publish:
    needs: [estate, migrate, rules, hygiene]
    # A green push to main and nothing else. An image tag a release manifest pins has to name
    # something that passed, on the branch it will be deployed from.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: cloudsforge-online/micro-org/.github/workflows/publish-image.yml@main
    with:
      kind: service
    secrets:
      # The same sibling checkouts the Dockerfile's named build contexts need: the image cannot be
      # built without micro-runtime and micro-contracts beside it.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: write
